{% with images=post.images.all %}{% if images %}
<div class="mt-3 grid gap-2 {% if images|length > 1 %}grid-cols-2{% endif %}">
  {% for img in images %}
    <a href="{{ img.image.url }}" target="_blank" rel="noopener"><img src="{{ img.image.url }}" alt="" width="{{ img.width }}" height="{{ img.height }}" loading="lazy" class="max-h-96 w-full rounded-lg border border-stone-200 object-cover dark:border-stone-800"></a>
  {% endfor %}
</div>
{% endif %}{% endwith %}
