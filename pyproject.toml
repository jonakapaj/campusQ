[project]
name = "campusq"
version = "0.1.0"
description = "A social network for Albanian university students and professors."
requires-python = ">=3.13"
dependencies = [
    "django>=5.2,<5.3",
    "django-allauth>=65",
    "django-stubs-ext>=6.1.2",
    "markdown>=3.11.3",
    "nh3>=0.3.8",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "django-stubs>=5.2,<5.3",
    "factory-boy>=3.3.3",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
    "types-markdown>=3.11.3.20261122",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "S", "SIM", "DJ", "RUF", "N", "C4", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["/migrations/", "^\\.venv/"]

[[tool.mypy.overrides]]
module = ["allauth.*"]
ignore_missing_imports = true

# factory_boy is generic (Factory[Model].create() is typed) but its declarations
# (Sequence, SubFactory, post_generation) are untyped. Relax that in factories only.
[[tool.mypy.overrides]]
module = ["factory", "factory.*"]
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["tests.factories"]
disallow_untyped_calls = false
disallow_untyped_decorators = false

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "--strict-markers"
