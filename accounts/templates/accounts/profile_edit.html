{% extends "base.html" %}
{% load i18n %}
{% block title %}{% translate "Edit profile" %} · CampusQ{% endblock %}
{% block content %}
  <div class="mx-auto max-w-md">
    <div class="card">
      <h1 class="text-2xl font-bold tracking-tight">{% translate "Edit profile" %}</h1>
      <form method="post" enctype="multipart/form-data" class="form mt-6 space-y-5" novalidate>
        {% csrf_token %}
        {% include "account/_fields.html" with form=form %}
        <div class="flex items-center justify-between gap-4">
          <button type="submit" class="btn-primary">{% translate "Save" %}</button>
          <a href="{% url 'profile' user.pk %}" class="link text-sm">{% translate "Cancel" %}</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
