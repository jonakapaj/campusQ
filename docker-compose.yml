name: campusq  # fixed, so renaming the folder never orphans the database

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: campusq
      POSTGRES_USER: campusq
      POSTGRES_PASSWORD: campusq  # local development only
    ports:
      - "127.0.0.1:5432:5432"  # bind to localhost only, never the LAN
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusq -d campusq"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
