{% load i18n static %}<!doctype html>
{% get_current_language as LANGUAGE_CODE %}
<html lang="{{ LANGUAGE_CODE }}" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>{% block title %}CampusQ{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script src="{% static 'js/app.js' %}" defer></script>
</head>
<body class="flex min-h-full flex-col bg-stone-50 font-sans text-stone-900 antialiased dark:bg-stone-950 dark:text-stone-100">
  <header class="sticky top-0 z-10 border-b border-stone-200 bg-white/80 backdrop-blur dark:border-stone-800 dark:bg-stone-900/80">
    <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-4">
      <a href="{% url 'home' %}" class="flex items-center gap-2 font-semibold tracking-tight">
        <span class="grid size-8 place-items-center rounded-lg bg-brand-600 text-white" aria-hidden="true">Q</span>
        <span class="text-lg">CampusQ</span>
      </a>

      <form action="{% url 'set_language' %}" method="post" class="flex items-center gap-2">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.get_full_path }}">
        <label for="language-select" class="sr-only">{% translate "Language" %}</label>
        <select id="language-select" name="language" data-autosubmit
                class="rounded-lg border border-stone-300 bg-white py-1.5 pr-8 pl-3 text-sm shadow-xs focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 focus:outline-none dark:border-stone-700 dark:bg-stone-900">
          {% get_available_languages as LANGUAGES %}
          {% get_language_info_list for LANGUAGES as languages %}
          {% for language in languages %}
            <option value="{{ language.code }}"{% if language.code == LANGUAGE_CODE %} selected{% endif %}>{{ language.name_local|capfirst }}</option>
          {% endfor %}
        </select>
        <noscript>
          <button type="submit" class="rounded-lg border border-stone-300 px-3 py-1.5 text-sm">{% translate "Change" %}</button>
        </noscript>
      </form>
    </div>
  </header>

  <main class="mx-auto w-full max-w-5xl flex-1 px-4 py-12 sm:py-20">
    {% block content %}{% endblock %}
  </main>

  <footer class="border-t border-stone-200 dark:border-stone-800">
    <div class="mx-auto max-w-5xl px-4 py-6 text-sm text-stone-500">
      &copy; {% now "Y" %} CampusQ
    </div>
  </footer>
</body>
</html>
