{% comment %}Photo or initials circle. Usage: {% include "core/_avatar.html" with person=user size="size-10" %}{% endcomment %}
{% if person.avatar %}<img src="{{ person.avatar.url }}" alt="" class="{{ size|default:'size-10' }} shrink-0 rounded-full object-cover" loading="lazy" width="256" height="256">{% else %}<span class="{{ size|default:'size-10' }} grid shrink-0 place-items-center rounded-full bg-brand-100 font-semibold text-brand-700 dark:bg-brand-500/20 dark:text-brand-100" aria-hidden="true">{{ person.initials }}</span>{% endif %}
